name: Node 20 CI

on:
  push:
    branches:
      - update-node-20
      - 'chore/step-00-*'
  pull_request:
    branches:
      - develop
      - update-node-20

jobs:
  # ----------------------------------------------------------------
  # Job 1 — Tests unitaires et intégration
  # ----------------------------------------------------------------
  unit-and-integration:
    name: Tests (unit + integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run tests
        run: NODE_ENV=test npm test

  # ----------------------------------------------------------------
  # Job 2 — Vérification du build webpack
  # ----------------------------------------------------------------
  build-check:
    name: Webpack build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build (production)
        run: npm run build

  # ----------------------------------------------------------------
  # Job 3 — Smoke test du serveur Express
  # ----------------------------------------------------------------
  server-smoke:
    name: Server smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Start server in background
        run: npm run smoke:server &

      - name: Wait for server on port 3001
        run: npx wait-on tcp:3001 --timeout 30000

      - name: Check server responds
        run: curl -sf http://localhost:3001/ || curl -sf http://localhost:3001/socket.io/ || true

      - name: Server started successfully
        run: echo "Server smoke test passed — port 3001 is open"

  # ----------------------------------------------------------------
  # Job 4 — Tests E2E Playwright (activé quand la branche 0.3 est mergée)
  # ----------------------------------------------------------------
  e2e:
    name: E2E Playwright
    runs-on: ubuntu-latest
    # Ce job est skippé si le dossier e2e/ n'existe pas encore
    steps:
      - uses: actions/checkout@v4

      - name: Check if e2e tests exist
        id: e2e-check
        run: |
          if [ -d "e2e" ] && [ -f "playwright.config.js" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node 20
        if: steps.e2e-check.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        if: steps.e2e-check.outputs.exists == 'true'
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        if: steps.e2e-check.outputs.exists == 'true'
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        if: steps.e2e-check.outputs.exists == 'true'
        run: npm run test:e2e

      - name: Skip message
        if: steps.e2e-check.outputs.exists != 'true'
        run: echo "E2E tests not yet set up (e2e/ directory missing) — skipping"
