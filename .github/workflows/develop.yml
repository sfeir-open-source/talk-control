name: Develop CI — Node 24

on:
    push:
        branches:
            - develop
    pull_request:
        branches:
            - develop

jobs:
    # ----------------------------------------------------------------
    # Job 1 — Tests unitaires et intégration (Vitest jsdom)
    # ----------------------------------------------------------------
    unit-and-integration:
        name: Tests Vitest (jsdom) — Node 24
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node 24
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci --legacy-peer-deps

            - name: Run tests
              run: NODE_ENV=test npm test

    # ----------------------------------------------------------------
    # Job 2 — Tests web components en browser mode (Vitest + Playwright)
    # ----------------------------------------------------------------
    web-components:
        name: Web components (browser mode) — Node 24
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node 24
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci --legacy-peer-deps

            - name: Install Playwright chromium
              run: npx playwright install chromium --with-deps

            - name: Run web component tests
              run: npm run test:components

    # ----------------------------------------------------------------
    # Job 3 — Tests E2E Playwright
    # ----------------------------------------------------------------
    e2e:
        name: E2E Playwright — Node 24
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node 24
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci --legacy-peer-deps

            - name: Install Playwright chromium
              run: npx playwright install chromium --with-deps

            - name: Run E2E tests
              run: npm run test:e2e

    # ----------------------------------------------------------------
    # Job 4 — Coverage
    # ----------------------------------------------------------------
    coverage:
        name: Coverage check — Node 24
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node 24
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci --legacy-peer-deps

            - name: Run coverage (thresholds enforced in vitest.config.ts)
              run: NODE_ENV=test npm run coverage

    # ----------------------------------------------------------------
    # Job 5 — Vite build (production)
    # ----------------------------------------------------------------
    build-check:
        name: Vite build — Node 24
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node 24
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci --legacy-peer-deps

            - name: Build (production)
              run: npm run build

    # ----------------------------------------------------------------
    # Job 6 — TypeScript strict
    # ----------------------------------------------------------------
    typecheck:
        name: TypeScript strict — Node 24
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node 24
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci --legacy-peer-deps

            - name: TypeScript strict check
              run: npx tsc --noEmit

    # ----------------------------------------------------------------
    # Job 7 — Smoke test du serveur Express
    # ----------------------------------------------------------------
    server-smoke:
        name: Server smoke test — Node 24
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node 24
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci --legacy-peer-deps

            - name: Start server in background
              run: npm run smoke:server &

            - name: Wait for server on port 3001
              run: npx wait-on tcp:3001 --timeout 30000

            - name: Check server responds
              run: curl -sf http://localhost:3001/ || curl -sf http://localhost:3001/socket.io/ || true

            - name: Server started successfully
              run: echo "Server smoke test passed — port 3001 is open"
