name: Node 22 & 24 CI

on:
  push:
    branches:
      - chore/step-01-node-runtime
      - update-node-20
  pull_request:
    branches:
      - develop
      - update-node-20

jobs:
  # ----------------------------------------------------------------
  # Job 1 — Tests sur Node 22 et 24 (matrix)
  # ----------------------------------------------------------------
  unit-and-integration:
    name: Tests — Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22', '24']
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run tests
        run: NODE_ENV=test npm test

  # ----------------------------------------------------------------
  # Job 2 — Coverage (Node 22)
  # ----------------------------------------------------------------
  coverage:
    name: Coverage check — Node 22
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run coverage
        run: NODE_ENV=test npm run coverage

      - name: Check coverage thresholds
        run: npm run coverage:check

  # ----------------------------------------------------------------
  # Job 3 — Build webpack sur Node 22 et 24 (matrix)
  # ----------------------------------------------------------------
  build-check:
    name: Webpack build — Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22', '24']
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build (production)
        run: npm run build

  # ----------------------------------------------------------------
  # Job 4 — Smoke test du serveur Express (Node 22)
  # ----------------------------------------------------------------
  server-smoke:
    name: Server smoke test — Node 22
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Start server in background
        run: npm run smoke:server &

      - name: Wait for server on port 3001
        run: npx wait-on tcp:3001 --timeout 30000

      - name: Check server responds
        run: curl -sf http://localhost:3001/ || curl -sf http://localhost:3001/socket.io/ || true

      - name: Server started successfully
        run: echo "Server smoke test passed — port 3001 is open"
